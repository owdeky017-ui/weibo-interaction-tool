name: CI

# 触发条件：推送到主分支、任何 PR、以及手动触发
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

# 同一分支的重复推送只保留最新一次，省额度
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 代码与日志里有大量中文，强制 UTF-8 避免 Windows 控制台乱码
  PYTHONUTF8: "1"
  PYTHONIOENCODING: utf-8
  PIP_DISABLE_PIP_VERSION_CHECK: "1"

# 所有 actions 都用浮动的主版本标签（@v7），不钉到具体补丁版：
# 补丁由 GitHub 自己维护，钉死反而收不到安全修复；主版本内的行为是
# 向后兼容的，真出问题会在日志里以弃用警告的形式提前暴露出来
# （这次从 @v4 升到 @v7 就是这么发现的）。
#
# 注意：checkout / setup-python / upload-artifact 从 v6 起要求
# Actions Runner >= 2.327.1。GitHub 托管 runner 始终满足，
# 但将来若改用自建 runner，需要先确认版本。

jobs:
  # ---------------------------------------------------------------------------
  # 静态检查：ruff（lint + format）+ mypy（类型）
  # ---------------------------------------------------------------------------
  lint:
    name: lint · ruff + format + mypy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: ruff check
        run: ruff check --output-format=github .

      - name: ruff format --check
        # 与 lint 分开：格式问题不该混进 lint 结果，排查时也更清楚
        run: ruff format --check --diff .

      - name: mypy
        # 无参数运行：文件列表写在 pyproject.toml 的 [tool.mypy] files 里
        run: mypy

  # ---------------------------------------------------------------------------
  # 单元测试：Windows 上跑（应用是 tkinter GUI + DPAPI，只在 Windows 才有意义）
  # ---------------------------------------------------------------------------
  test:
    name: test · Python ${{ matrix.python-version }} · windows
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: 安装依赖
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,gui]"

      - name: pytest
        run: pytest --cov --cov-report=term-missing --cov-report=xml

      - name: 冒烟测试（119 项断言）
        # 项目自带的端到端脚本，覆盖 pytest 未涉及的部分：
        # 真实构建 GUI 后读控件状态、DPAPI 加解密往返与篡改检测、
        # 打包路径解析。Tk 起不来时只跳过 GUI 那一段，不会误报失败。
        run: python smoke_test.py

      - name: 上传覆盖率报告
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.python-version }}
          path: coverage.xml
          if-no-files-found: ignore
